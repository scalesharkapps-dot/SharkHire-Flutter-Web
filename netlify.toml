# Netlify – SharkHire Flutter web app (continuous deployment from GitHub).
# Netlify has no Flutter, so the build script downloads Flutter 3.50.0 (the
# version the app is developed with, stable channel) and runs
# `flutter build web` into build/web. No secrets or environment variables.
[build]
  base    = "mobile_app"
  publish = "build/web"
  command = "bash tool/vercel_build.sh"

# Routing lives in mobile_app/web/_redirects (copied into build/web):
#   /api/*  -> backend (no CORS needed)
#   /*      -> /index.html (no 404 on refresh)

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/main.dart.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/flutter_bootstrap.js"
  [headers.values]
    Cache-Control = "no-cache"
